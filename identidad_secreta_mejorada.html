<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identidad secreta</title>
<style>
  :root {
    --bg: #10131f; --panel: #191e30; --panel2: #202740; --ink: #f4f3ff;
    --muted: #a7afc9; --accent: #a9f0d1; --accent2: #f7c873; --line: #343d59;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    background: radial-gradient(ellipse at 15% 0%, #28304e 0%, transparent 38%),
                radial-gradient(ellipse at 95% 30%, #332746 0%, transparent 32%), var(--bg);
  }
  .wrap { width: 100%; min-height: 100vh; margin: 0 auto; padding: 22px clamp(14px, 3vw, 42px) 28px; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; gap:18px; margin-bottom:22px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .mark { width:44px; height:44px; display:grid; place-items:center; border-radius:14px; color:#10131f; background:var(--accent); font-size:22px; font-weight:900; box-shadow:0 8px 30px #a9f0d133; }
  h1 { margin:0; font-size:clamp(1.5rem, 4vw, 2.25rem); letter-spacing:-.05em; }
  .subtitle { color:var(--muted); margin:5px 0 0; font-size:.93rem; }
  .pill { border:1px solid var(--line); background:#ffffff08; padding:9px 13px; border-radius:999px; color:var(--muted); font-size:.82rem; white-space:nowrap; }
  .layout { display:block; flex:1; min-height:0; }
  .panel { background:linear-gradient(145deg,#1c2236ee,#171c2bee); border:1px solid var(--line); border-radius:22px; padding:clamp(14px, 2vw, 28px); box-shadow:0 18px 55px #0002; }
  .panel h2 { font-size:1.02rem; margin:0 0 8px; letter-spacing:-.02em; }
  .settings-toggle { display:flex; align-items:center; gap:8px; background:#ffffff09; border:1px solid var(--line); color:var(--ink); padding:10px 14px; border-radius:12px; }
  .board-panel { min-height:calc(100vh - 125px); display:flex; flex-direction:column; justify-content:center; }
  .grid { flex:1; align-content:center; grid-template-rows:repeat(2, minmax(190px, 1fr)); gap:clamp(10px, 2vw, 22px); }
  .character { min-height:clamp(160px, 28vh, 270px); border-radius:22px; box-shadow:0 14px 32px #0002; }
  .avatar { width:clamp(48px, 5vw, 70px); height:clamp(48px, 5vw, 70px); font-size:clamp(24px, 3vw, 34px); border-radius:20px; }
  .name { font-size:clamp(1.45rem, 2.8vw, 2.25rem); }
  dialog { width:min(560px, calc(100vw - 28px)); border:1px solid var(--line); border-radius:22px; background:#191e30; color:var(--ink); padding:24px; box-shadow:0 30px 100px #0009; }
  dialog::backdrop { background:#050711c9; backdrop-filter:blur(7px); }
  .dialog-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .dialog-head h2 { margin:0; font-size:1.15rem; }
  .close-dialog { background:#ffffff0b; border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:8px 11px; }
  .hint { color:var(--muted); font-size:.86rem; line-height:1.55; margin:0 0 15px; }
  textarea { width:100%; min-height:185px; resize:vertical; background:#101523; border:1px solid #3a4564; color:var(--ink); border-radius:13px; padding:13px; font:inherit; line-height:1.55; outline:none; }
  textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px #a9f0d11a; }
  .buttons { display:flex; gap:9px; flex-wrap:wrap; margin-top:13px; }
  button { border:0; cursor:pointer; font:inherit; font-weight:750; border-radius:12px; padding:12px 15px; transition:transform .15s, filter .15s; }
  button:hover { filter:brightness(1.08); transform:translateY(-1px); }
  button:active { transform:translateY(0); }
  .primary { flex:1; background:var(--accent); color:#11182a; }
  .secondary { background:#ffffff0b; border:1px solid var(--line); color:var(--ink); }
  .status { min-height:40px; margin-top:13px; color:var(--muted); font-size:.84rem; line-height:1.45; }
  .status.error { color:#ffb2ad; }
  .board-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:0 0 16px; }
  .board-head h2 { margin:0; font-size:1.12rem; }
  .count { color:var(--muted); font-size:.82rem; }
  .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
  .character { position:relative; min-height:164px; padding:13px 10px 15px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; border:1px solid #414b6a; border-radius:17px; background:linear-gradient(155deg,#29324d,#20273d); color:var(--ink); overflow:hidden; }
  .character::before { content:""; position:absolute; inset:0 0 auto; height:4px; background:var(--accent); opacity:.8; }
  .character:nth-child(2n)::before { background:var(--accent2); }
  .character:nth-child(3n)::before { background:#c4b5fd; }
  .character:disabled { cursor:default; opacity:.62; }
  .number { position:absolute; top:12px; left:12px; font-size:1.5rem; line-height:1; font-weight:900; color:#f4f3ff; background:transparent; border:0; padding:0; border-radius:0; }
  .avatar { width:49px; height:49px; display:grid; place-items:center; border-radius:16px; background:#ffffff0a; border:1px solid #ffffff16; font-size:24px; }
  .name { font-weight:800; font-size:clamp(1.45rem, 2.8vw, 2.25rem); line-height:1.2; overflow-wrap:anywhere; }
  .swap { font-size:.72rem; color:var(--muted); font-weight:550; }
  .character:not(:disabled):hover { border-color:var(--accent); background:linear-gradient(155deg,#303b59,#252e48); }
  .empty { grid-column:1/-1; padding:35px 18px; text-align:center; color:var(--muted); border:1px dashed #414b6a; border-radius:16px; line-height:1.6; }
  .footnote { color:var(--muted); font-size:.8rem; line-height:1.5; margin:17px 0 0; }
  @media (max-width: 820px) { .grid { gap:9px; grid-template-rows:repeat(2, minmax(150px, 1fr)); } .character { min-height:145px; } .board-panel { min-height:calc(100vh - 110px); } }
  @media (max-width: 480px) { .wrap { padding:16px 10px 18px; } header { align-items:center; } .brand { gap:8px; } .mark { width:38px; height:38px; } .subtitle { font-size:.78rem; } .settings-toggle { padding:9px 10px; font-size:.82rem; } .panel { padding:12px; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:repeat(4, minmax(125px, 1fr)); gap:8px; } .character { min-height:125px; padding:12px 8px; } .number { top:8px; left:8px; font-size:1.35rem; } .board-panel { min-height:calc(100vh - 90px); } .board-head { margin-bottom:12px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">?</div>
      <div><h1>Identidad secreta</h1></div>
    </div>
    <button class="settings-toggle" id="settingsBtn"><span aria-hidden="true">⚙</span> Añadir personajes</button>
  </header>

  <main class="layout">
    <section class="panel board-panel">
      <div class="grid" id="board">
        <div class="empty">¿Preparado para jugar?<br>Pulsa <strong>JUGAR</strong> para revelar tus ocho identidades.</div>
      </div>
      <div class="buttons" style="justify-content:center; margin-top:20px">
        <button class="primary" id="playBtn" style="flex:0 1 240px; padding:16px 24px; font-size:1.05rem; letter-spacing:.04em">JUGAR ✦</button>
        <button class="secondary" id="resetBtn" title="Reinicia la partida">Nueva partida</button>
      </div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <div class="dialog-head">
      <h2>⚙ Configuración de la partida</h2>
      <button class="close-dialog" id="closeSettings" aria-label="Cerrar configuración">✕</button>
    </div>
    <p class="hint">Añade o edita tu lista de personajes. Sepáralos con comas. Necesitas al menos ocho nombres diferentes.</p>
    <textarea id="namesInput" placeholder="Ej.: La inventora, Capitán Niebla, Doctora Sol, El jardinero, ...">Antonio Recio, Amador Rivas, Coque Calatrava, Enrique Pastor, Berta Escobar, Maite Figueroa, Fermín Trujillo, Javi Maroto, Belén Esteban, David Broncano, El Gran Wyoming, Pablo Motos, Mercedes Milá, Jesús Vázquez, Roberto Leal, Arturo Valls, Torrente, El Risitas, Chiquito de la Calzada, Paquita Salas, Carlos Sobera, Andreu Buenafuente, Berto Romero, Homer Simpson, Bart Simpson, Peter Griffin, Walter White, Sheldon Cooper, Mr. Bean, Michael Scott, Wednesdays Addams, Daenerys Targaryen, Jon Snow, Rick Sánchez, Morty Smith, Sherlock Holmes, Doctor Who, Hannah Montana, El Chavo del Ocho, Batman, Joker, Superman, Spider-Man, Iron Man, Thanos, Darth Vader, Luke Skywalker, Yoda, Harry Potter, Voldemort, Hermione Granger, Frodo Bolsón, Gollum, Jack Sparrow, Indiana Jones, James Bond, Barbie, Terminator, Shrek, Asno, Fiona, Loquendo, El Zorro, Mortadelo, Filemón, Goku, Vegeta, Luffy, Naruto, Pikachu, Ash Ketchum, Doraemon, Shin-Chan, Nobita, Oliver Atom, Bob Esponja, Patricio Estrella, Mickey Mouse, Donald Duck, Bugs Bunny, Scooby-Doo, Tom, Jerry, Sonic, Mario Bros, Pedro Sánchez, Mariano Rajoy, José Luis Rodríguez Zapatero, José María Aznar, Felipe VI, Letizia Ortiz, Juan Carlos I, Santiago Abascal, Isabel Díaz Ayuso, Carles Puigdemont, Donald Trump, Joe Biden, Barack Obama, Vladimir Putin, Kim Jong-un, Emmanuel Macron, Adolf Hitler, Julio César, Cleopatra, Napoleón Bonaparte, Fidel Castro, Che Guevara, Francisco Franco, Isabel la Católica, Albert Einstein, Isaac Newton, Marie Curie, Galileo Galilei, Stephen Hawking, Leonardo da Vinci, Miguel de Cervantes, Don Quijote, Sancho Panza, William Shakespeare, Christóbal Colón, Charles Darwin, Sigmund Freud, Nikola Tesla, Thomas Edison, Steve Jobs, Rosalía, C. Tangana, Julio Iglesias, David Bisbal, Melendi, Joaquín Sabina, Quevedo, Aitana, Michael Jackson, Shakira, Freddie Mercury, Madonna, Beyoncé, Taylor Swift, Eminem, Bad Bunny, Pablo Picasso, Salvador Dalí, Vincent van Gogh, Wolfgang Amadeus Mozart, Ludwig van Beethoven, Lola Flores, Raphael, Ibai Llanos, Rafa Nadal, Fernando Alonso, Carlos Sainz, Pau Gasol, Marc Márquez, Ilian Topuria, Andrés Iniesta, Iker Casillas</textarea>
    <div class="buttons">
      <button class="primary" id="saveSettings">Guardar personajes</button>
      <button class="secondary" id="closeSettings2">Cancelar</button>
    </div>
    <div class="status" id="settingsStatus" aria-live="polite">Los cambios se aplicarán al iniciar la próxima partida.</div>
  </dialog>
</div>
<script>
(() => {
  const input = document.getElementById('namesInput');
  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsDialog = document.getElementById('settingsDialog');
  const settingsStatus = document.getElementById('settingsStatus');
  const board = document.getElementById('board');
  const status = document.getElementById('status');
  const counter = document.getElementById('counter');

  const symbols = ['✦','◈','✺','⬟','❖','✧','☼','◇'];
  let used = new Set();
  let current = Array(8).fill(null);
  let pool = [];

  function getNames() {
    return input.value.split(',').map(name => name.trim()).filter(Boolean);
  }
  function shuffle(items) {
    const result = [...items];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }
  function setStatus(message, error = false) {
    status.textContent = message;
    status.classList.toggle('error', error);
  }
  function render() {
    board.replaceChildren();
    current.forEach((name, index) => {
      if (name === null) return;
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'character';
      card.setAttribute('aria-label', `Posición ${index + 1}: ${name}. Pulsa para cambiar`);
      card.innerHTML = `<span class="number">${index + 1}</span><span class="avatar" aria-hidden="true">${symbols[index % symbols.length]}</span><span class="name"></span>`;
      card.querySelector('.name').textContent = name;
      card.addEventListener('click', () => swapCharacter(index));
      board.appendChild(card);
    });
    counter.textContent = `${current.filter(Boolean).length} / 8 colocados`;
    if (current.every(name => name === null)) {
      board.innerHTML = '<div class="empty">¿Preparado para jugar?<br>Pulsa <strong>JUGAR</strong> para revelar tus ocho identidades.</div>';
    }
  }
  function swapCharacter(index) {
    const available = pool.filter(name => !used.has(name));
    if (available.length === 0) {
      setStatus('¡Ya han salido todos los personajes de la lista! Pulsa «Nueva partida» para volver a empezar.', true);
      return;
    }
    const next = available[Math.floor(Math.random() * available.length)];
    used.add(next);
    current[index] = next;
    render();
    setStatus(`Posición ${index + 1} actualizada. ${used.size} personaje(s) usados en esta partida.`);
  }
  function startGame() {
    const names = [...new Set(getNames())];
    if (names.length < 8) {
      setStatus(`Necesitas al menos 8 nombres diferentes. Ahora hay ${names.length}.`, true);
      settingsStatus.textContent = `Necesitas al menos 8 nombres diferentes. Ahora hay ${names.length}.`;
      settingsDialog.showModal();
      return;
    }
    pool = names;
    used = new Set();
    current = shuffle(pool).slice(0, 8);
    current.forEach(name => used.add(name));
    render();
    setStatus(`¡Partida lista! Ya han aparecido ${used.size} personajes. Pulsa cualquier etiqueta para cambiarla.`);
  }
  function newGame() {
    used = new Set();
    current = Array(8).fill(null);
    pool = [];
    render();
    setStatus('Registro reiniciado. Pulsa «JUGAR» para empezar otra partida.');
  }
  function closeSettings() { settingsDialog.close(); }
  settingsBtn.addEventListener('click', () => settingsDialog.showModal());
  document.getElementById('closeSettings').addEventListener('click', closeSettings);
  document.getElementById('closeSettings2').addEventListener('click', closeSettings);
  document.getElementById('saveSettings').addEventListener('click', () => {
    const names = [...new Set(getNames())];
    if (names.length < 8) {
      settingsStatus.textContent = `Añade al menos 8 nombres diferentes. Ahora hay ${names.length}.`;
      settingsStatus.classList.add('error');
      return;
    }
    settingsStatus.classList.remove('error');
    settingsStatus.textContent = `Lista preparada: ${names.length} personajes diferentes. Pulsa JUGAR para iniciar.`;
    closeSettings();
    setStatus(`Lista preparada con ${names.length} personajes. Pulsa JUGAR para empezar.`);
  });
  settingsDialog.addEventListener('click', (event) => {
    if (event.target === settingsDialog) closeSettings();
  });
  playBtn.addEventListener('click', startGame);
  resetBtn.addEventListener('click', newGame);
  render();
})();
</script>
</body>
</html>
