<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identidad secreta</title>
<style>
  :root{
    --bg:#f7f7f9;
    --ink:#151515;
    --muted:#5f5f5f;
    --line:#d7d7dc;
    --panel:#ffffff;
    --panel-alt:#fbfbfc;

    --c-yellow:#f5d000;
    --c-green:#00b74a;
    --c-blue:#0066ff;
    --c-orange:#ff4f1a;
    --c-pink:#ff2fa6;
    --c-purple:#6b3dff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:#000000;
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    background:#f7f7f9;
    line-height:1.4;
  }
  button{font-family:inherit; cursor:pointer; border:0; background:none; color:inherit}
  .wrap{
    width:100%; max-width:1400px; min-height:100vh; margin:0 auto;
    padding:clamp(10px,1.6vw,18px) clamp(12px,2.4vw,28px) clamp(16px,2vw,26px);
    display:flex; flex-direction:column; gap:clamp(10px,1.2vw,16px);
  }
  header{display:flex; flex-direction:column; gap:clamp(8px,1vw,12px)}
  .topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}

  .gamebar{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    padding:8px 10px; border:1px solid var(--line); border-radius:14px; background:var(--panel);
  }
  .gamebar-actions{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .primary{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:999px;
    font-weight:800; font-size:.88rem; letter-spacing:.01em; color:#151515;
    background:linear-gradient(#fff7b8,#f5d000); border:1px solid #c9b000;
    box-shadow:inset 0 1px 0 #ffffffcc;
    transition:filter .15s, transform .15s;
  }
  .primary:hover{filter:brightness(.98)}
  .primary:active{transform:translateY(1px)}
  .primary:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .secondary{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:999px;
    font-weight:700; font-size:.88rem; color:var(--ink);
    background:var(--panel); border:1px solid var(--line);
    transition:background .15s;
  }
  .secondary:hover{background:#f3f3f5}
  .secondary:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .count{
    font-size:.78rem; color:var(--muted); white-space:nowrap;
  }
  main.layout{flex:1; display:flex; min-height:0}
  .panel{
    width:100%; display:flex; flex-direction:column; overflow:hidden;
    border:1px solid #d7d7dc; border-radius:16px; background:#ffffff;
    box-shadow:0 1px 1px #00000003;
  }
  .board-head{display:none}
  .grid{
    flex:1; display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
    gap:clamp(8px,1vw,12px); padding:clamp(10px,1.2vw,16px);
    align-content:stretch;
  }
  .character{
    --card:#6b6b6b;
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(6px,.8vw,10px); min-height:clamp(150px,24vh,260px);
    padding:clamp(14px,1.6vw,20px) clamp(10px,1.2vw,16px);
    border-radius:14px; border:4px solid var(--card); background:#ffffff;
    text-align:center; color:var(--ink);
    transition:filter .15s, transform .15s, box-shadow .15s;
  }
  .character:hover{filter:saturate(1.02); box-shadow:0 4px 10px #00000008}
  .character:active{transform:translateY(1px)}
  .character:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
  .character:nth-child(8n+1){--card:var(--c-yellow)}
  .character:nth-child(8n+2){--card:var(--c-green)}
  .character:nth-child(8n+3){--card:var(--c-blue)}
  .character:nth-child(8n+4){--card:var(--c-orange)}
  .character:nth-child(8n+5){--card:var(--c-pink)}
  .character:nth-child(8n+6){--card:var(--c-purple)}
  .character:nth-child(8n+7){--card:var(--c-yellow)}
  .character:nth-child(8n+8){--card:var(--c-green)}
  .number{
    position:absolute; top:10px; left:12px;
    font-size:clamp(1.1rem,1.6vw,1.4rem); font-weight:900; line-height:1;
    color:var(--card);
  }
  .avatar{
    display:grid; place-items:center; width:clamp(44px,4vw,56px); aspect-ratio:1;
    border-radius:12px; font-size:clamp(20px,2vw,24px); color:var(--card);
    background:color-mix(in srgb, var(--card) 12%, #ffffff);
    border:1px solid color-mix(in srgb, var(--card) 40%, #ffffff);
  }
  .name{
    font-weight:600; font-size:clamp(1rem,1.6vw,1.5rem); line-height:1.15;
    letter-spacing:-.01em; text-wrap:balance; overflow-wrap:anywhere;
  }
  .swap{display:none}
  .empty{
    grid-column:1/-1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; min-height:clamp(320px,56vh,620px); padding:clamp(20px,4vw,40px);
    text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:12px;
    background:var(--panel-alt); font-size:clamp(.9rem,1vw,1rem); line-height:1.6;
  }
  .empty-icon{display:none}
  .empty strong{color:var(--ink)}
  .controls{display:none}
  .status{
    display:none;
  }
  .footnote{display:none}
    .dialog-body{
      display:flex; flex-direction:column; gap:14px; padding:clamp(16px,2vw,24px);
      background-color: #ffffff !important;
      background-image: none !important;
      color: #000000 !important;
      border-radius:16px;
    }
  dialog {
    width:min(680px,calc(100vw - 24px));
    border:1px solid #c9c9cf;
    border-radius:16px;
    background: #ffffff !important;
    background-color: #ffffff !important;
    background-image: none !important;
    color: #000000 !important;
    padding: 0;
    box-shadow: 0 24px 48px -18px #00000026;
    -webkit-appearance: none;
    appearance: none;
  }
  dialog::backdrop { background: rgba(0,0,0,0.45); }
  .dialog-head{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .dialog-head h2{margin:0; font-size:clamp(.98rem,1vw,1.02rem); font-weight:800; letter-spacing:-.01em; color:#000000}
  .close-dialog{
    width:34px; height:34px; display:grid; place-items:center; border-radius:999px;
    background:#ffffff; border:1px solid #c9c9cf; color:#000000; -webkit-text-fill-color:#000000;
    transition:background .15s;
  }
  .close-dialog:hover{background:#f5f5f7}
  .close-dialog:focus-visible{outline:2px solid #000000; outline-offset:2px}
    .hint{margin:0; color:#000000 !important; font-size:.84rem; line-height:1.6; -webkit-text-fill-color:#000000}
    .dialog-body h2{color:#000000 !important; -webkit-text-fill-color:#000000}
  textarea{
    width:100%; min-height:clamp(160px,28vh,240px); resize:vertical; padding:12px 14px;
    border-radius:12px; border:1px solid #c9c9cf; background:#ffffff !important; color:#000000 !important;
    font:inherit; font-size:.9rem; line-height:1.7; outline:none; white-space:pre-wrap;
  }
  textarea::placeholder{color:#6b6b6b}
  textarea:focus{border-color:#8f8f95}
  .buttons{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
  .dialog-body .primary{padding:9px 16px; font-size:.86rem; color:#151515}
  .dialog-body .secondary{padding:9px 16px; font-size:.86rem; color:#000000; background:#ffffff; border:1px solid #c9c9cf}
  .dialog-body .status{display:block; margin:0; text-align:left; font-size:.8rem; color:#000000}
  .dialog-body .status.error{color:#d62828}
  dialog{
    width:min(620px,calc(100vw - 26px)); max-height:min(88vh,900px); padding:0; overflow:hidden;
    color:var(--ink); border:1px solid transparent; border-radius:26px;
    background:linear-gradient(#101427,#0b0e1c) padding-box, linear-gradient(135deg,var(--violet),var(--pink),var(--lime)) border-box;
    box-shadow:0 50px 140px -20px #000;
  }
  dialog::backdrop{background:#04050bd9; backdrop-filter:blur(12px) saturate(.7)}
  dialog[open]{animation:pop .3s cubic-bezier(.2,.9,.3,1)}
  .dialog-body{
    display:flex; flex-direction:column; gap:14px; overflow:auto;
    padding:clamp(18px,2.4vw,30px);
  }
  .dialog-head{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .dialog-head h2{margin:0; font-size:clamp(1.05rem,1.6vw,1.25rem); font-weight:900; letter-spacing:-.02em}
  .close-dialog{
    width:38px; height:38px; flex:none; display:grid; place-items:center; border-radius:12px;
    background:#ffffff0d; border:1px solid #ffffff1f; color:var(--ink); font-size:1rem;
    transition:background .18s, transform .18s, border-color .18s;
  }
  .close-dialog:hover{background:#ff3d9a22; border-color:#ff3d9a66; transform:rotate(90deg)}
  .hint{margin:0; color:var(--muted); font-size:.84rem; line-height:1.6}
  .hint strong{color:var(--lime)}
  textarea{
    width:100%; min-height:clamp(150px,26vh,230px); resize:vertical; padding:14px 16px;
    border-radius:16px; border:1px solid var(--line); background:#080b16; color:var(--ink);
    font:inherit; font-size:.86rem; line-height:1.65; outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  textarea::placeholder{color:#5b6484}
  textarea:focus{border-color:var(--lime); box-shadow:0 0 0 4px #c9ff3d1a}
  textarea::-webkit-scrollbar{width:10px}
  textarea::-webkit-scrollbar-track{background:transparent}
  textarea::-webkit-scrollbar-thumb{background:#2a3252; border-radius:999px; border:2px solid #080b16}
  textarea::-webkit-scrollbar-thumb:hover{background:#3b4670}
  .buttons{display:flex; gap:10px; flex-wrap:wrap}
  .dialog-body .primary{flex:1; padding:14px 20px; font-size:.88rem; letter-spacing:.06em}
  .dialog-body .secondary{flex:0 0 auto; padding:14px 20px; font-size:.86rem}
  .dialog-body .status{margin:0; text-align:left; font-size:.8rem}}50%{transform:translateY(-6px) rotate(-4deg)}}50%{background-position:100% 50%}}to{transform:translateX(320%) rotate(18deg)}}to{opacity:1; transform:none}}to{opacity:1; transform:none}}
  @media (max-width:1000px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .character{min-height:clamp(140px,18vh,190px)}
  }
  @media (max-width:520px){
    .wrap{padding:14px 10px 18px}
    .panel{border-radius:24px; padding:12px}
    .subtitle{letter-spacing:.14em; font-size:.66rem}
    h1{font-size:1.45rem}
    .mark{width:42px; border-radius:14px}
    .pill{display:none}
    .grid{gap:8px}
    .character{min-height:132px; border-radius:18px; padding:12px 8px; gap:6px}
    .number{font-size:1.15rem; top:8px; left:10px}
    .avatar{width:40px; border-radius:14px; font-size:20px}
    .name{font-size:.95rem}
    .swap{display:none}
    .primary{padding:15px 24px; font-size:.9rem}
    .secondary{padding:13px 18px; font-size:.82rem}
  }}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="gamebar">
      <div class="gamebar-actions">
        <button class="primary" id="playBtn">Jugar</button>
        <button class="secondary" id="resetBtn">Nueva partida</button>
        <button class="secondary" id="settingsBtn">Editar personajes</button>
      </div>
      <span class="count" id="counter">0 / 8</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel board-panel">
      <div class="board-head">
        <h2>Personajes</h2>
        <span class="count" id="counter2">0 / 8</span>
      </div>
      <div class="grid" id="board">
        <div class="empty">
          <span>Pulsa <strong>JUGAR</strong> para repartir las 8 identidades.</span>
        </div>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>
  </main>

  <dialog id="settingsDialog" style="color-scheme: light;">
      <div class="dialog-head">
        <h2>Editar personajes</h2>
        <button class="close-dialog" id="closeSettings" aria-label="Cerrar">✕</button>
      </div>
      <p class="hint">Separados por comas. Se necesitan al menos 8 nombres diferentes.</p>
      <textarea id="namesInput" spellcheck="false"></textarea>
      <div class="buttons">
        <button class="secondary" id="closeSettings2">Cancelar</button>
        <button class="primary" id="saveSettings">Guardar</button>
      </div>
      <p class="status" id="settingsStatus" aria-live="polite"></p>
    </div>
  </dialog>
</div>
<script>
(() => {
  const input = document.getElementById('namesInput');
  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsDialog = document.getElementById('settingsDialog');
  const settingsStatus = document.getElementById('settingsStatus');
  const board = document.getElementById('board');
  const status = document.getElementById('status');
  const counter = document.getElementById('counter');
  const counter2El = document.getElementById('counter2');

  const symbols = ['✦','◈','✺','⬟','❖','✧','☼','◇'];
  const personajes_iniciales = "Antonio Recio, Amador Rivas, Coque Calatrava, Enrique Pastor, Berta Escobar, Maite Figueroa, Fermín Trujillo, Javi Maroto, Belén Esteban, David Broncano, El Gran Wyoming, Pablo Motos, Mercedes Milá, Jesús Vázquez, Roberto Leal, Arturo Valls, Torrente, El Risitas, Chiquito de la Calzada, Paquita Salas, Carlos Sobera, Andreu Buenafuente, Berto Romero, Homer Simpson, Bart Simpson, Peter Griffin, Walter White, Sheldon Cooper, Mr. Bean, Michael Scott, Wednesdays Addams, Daenerys Targaryen, Jon Snow, Rick Sánchez, Morty Smith, Sherlock Holmes, Doctor Who, Hannah Montana, El Chavo del Ocho, Batman, Joker, Superman, Spider-Man, Iron Man, Thanos, Darth Vader, Luke Skywalker, Yoda, Harry Potter, Voldemort, Hermione Granger, Frodo Bolsón, Gollum, Jack Sparrow, Indiana Jones, James Bond, Barbie, Terminator, Shrek, Asno, Fiona, Loquendo, El Zorro, Mortadelo, Filemón, Goku, Vegeta, Luffy, Naruto, Pikachu, Ash Ketchum, Doraemon, Shin-Chan, Nobita, Oliver Atom, Bob Esponja, Patricio Estrella, Mickey Mouse, Donald Duck, Bugs Bunny, Scooby-Doo, Tom, Jerry, Sonic, Mario Bros, Pedro Sánchez, Mariano Rajoy, José Luis Rodríguez Zapatero, José María Aznar, Felipe VI, Letizia Ortiz, Juan Carlos I, Santiago Abascal, Isabel Díaz Ayuso, Carles Puigdemont, Donald Trump, Joe Biden, Barack Obama, Vladimir Putin, Kim Jong-un, Emmanuel Macron, Adolf Hitler, Julio César, Cleopatra, Napoleón Bonaparte, Fidel Castro, Che Guevara, Francisco Franco, Isabel la Católica, Albert Einstein, Isaac Newton, Marie Curie, Galileo Galilei, Stephen Hawking, Leonardo da Vinci, Miguel de Cervantes, Don Quijote, Sancho Panza, William Shakespeare, Christóbal Colón, Charles Darwin, Sigmund Freud, Nikola Tesla, Thomas Edison, Steve Jobs, Rosalía, C. Tangana, Julio Iglesias, David Bisbal, Melendi, Joaquín Sabina, Quevedo, Aitana, Michael Jackson, Shakira, Freddie Mercury, Madonna, Beyoncé, Taylor Swift, Eminem, Bob Marley, Amy Winehouse, Adele, Luis Miguel, Raphael, Juan Gabriel, Celia Cruz, Benny Hill, Cantinflas, Paco Martinez Soria, José Mota, Cruz y Raya, Martes y 13, Les Luthiers";

  let used = new Set();
  let current = Array(8).fill(null);
  let pool = [];

  function getNames() {
    return input.value.split(',').map(name => name.trim()).filter(Boolean);
  }
  function shuffle(items) {
    const result = [...items];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }
  function setStatus(message, error = false) {
    status.textContent = message;
    status.classList.toggle('error', error);
  }
  function render() {
    board.replaceChildren();
    current.forEach((name, index) => {
      if (name === null) return;
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'character';
      card.style.setProperty('--i', index);
      card.setAttribute('aria-label', `Posición ${index + 1}: ${name}. Pulsa para cambiar`);
      card.innerHTML = `<span class="number">${index + 1}</span><span class="avatar" aria-hidden="true">${symbols[index % symbols.length]}</span><span class="name"></span>`;
      card.querySelector('.name').textContent = name;
      card.addEventListener('click', () => swapCharacter(index));
      board.appendChild(card);
    });
    const count = current.filter(Boolean).length;
    counter.textContent = `${count} / 8`;
    if (counter2El) counter2El.textContent = `${count} / 8`;
    if (current.every(name => name === null)) {
      board.innerHTML = '<div class="empty"><span>Pulsa <strong>JUGAR</strong> para repartir las 8 identidades.</span></div>';
    }
  }
  function swapCharacter(index) {
    const available = pool.filter(name => !used.has(name));
    if (available.length === 0) {
      setStatus('No quedan personajes en la lista.', true);
      return;
    }
    const next = available[Math.floor(Math.random() * available.length)];
    used.add(next);
    current[index] = next;
    render();
    const card = board.children[index];
    if (card && card.animate) {
      card.animate(
        [{ transform: 'scale(.98)' }, { transform: 'scale(1.01)' }, { transform: 'none' }],
        { duration: 160, easing: 'ease-out' }
      );
    }
    setStatus('');
  }
  function startGame() {
    const names = [...new Set(getNames())];
    if (names.length < 8) {
      setStatus(`Necesitas al menos 8 nombres diferentes. Ahora hay ${names.length}.`, true);
      settingsStatus.textContent = `Necesitas al menos 8 nombres diferentes. Ahora hay ${names.length}.`;
      settingsDialog.showModal();
      return;
    }
    pool = names;
    used = new Set();
    current = shuffle(pool).slice(0, 8);
    current.forEach(name => used.add(name));
    render();
    setStatus('');
  }
  function newGame() {
    used = new Set();
    current = Array(8).fill(null);
    pool = [];
    render();
    setStatus('');
  }
  function closeSettings() { settingsDialog.close(); }
  if (settingsBtn)   settingsBtn.addEventListener('click', () => {
    if (!settingsDialog) return;
    if (typeof settingsDialog.showModal === 'function') {
      settingsDialog.showModal();
    } else {
      settingsDialog.setAttribute('open', '');
    }
  });
  const close1 = document.getElementById('closeSettings');
  const close2 = document.getElementById('closeSettings2');
  const saveBtn = document.getElementById('saveSettings');
  if (close1) close1.addEventListener('click', closeSettings);
  if (close2) close2.addEventListener('click', closeSettings);
  if (saveBtn) saveBtn.addEventListener('click', () => {
    const names = [...new Set(getNames())];
    if (names.length < 8) {
      settingsStatus.textContent = `Añade al menos 8 nombres diferentes. Ahora hay ${names.length}.`;
      settingsStatus.classList.add('error');
      return;
    }
    settingsStatus.classList.remove('error');
    settingsStatus.textContent = `Lista preparada con ${names.length} personajes.`;
    closeSettings();
  });
  if (settingsDialog) {
    settingsDialog.addEventListener('click', (event) => {
      if (event.target === settingsDialog) closeSettings();
    });
  }
  if (playBtn) playBtn.addEventListener('click', startGame);
  if (resetBtn) resetBtn.addEventListener('click', newGame);

  if (input && !input.value) {
    input.value = personajes_iniciales;
  }

  if (playBtn) playBtn.onclick = startGame;
  if (resetBtn) resetBtn.onclick = newGame;
  render();
})();
</script>
</body>
</html>
